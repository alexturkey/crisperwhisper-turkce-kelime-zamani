# Release notes categories (GitHub generated notes). Labels that exist by default: bug, documentation, enhancement, ...
# New contributors are listed automatically by GitHub; the notes also name every pull request author.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: "Fixes / Düzeltmeler"
      labels:
        - bug
    - title: "Improvements / İyileştirmeler"
      labels:
        - enhancement
    - title: "Docs and translations / Belge ve çeviri"
      labels:
        - documentation
    - title: "Other changes / Diğer değişiklikler"
      labels:
        - "*"
